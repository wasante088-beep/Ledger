<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ledger</title>
<meta name="theme-color" content="#0a0c14" />
<meta name="description" content="Personal finance tracker" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
:root{
  --bg:#0a0c14; --surface:#12141f; --raised:#191c2b; --line:#232738; --line-soft:#1c2030;
  --text:#eef0f6; --dim:#9aa1b5; --faint:#5d6478;
  --indigo:#818cf8; --green:#4ade80; --red:#fb7185;
  --grad:linear-gradient(135deg,#4338ca 0%,#6d28d9 55%,#7c3aed 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;padding-bottom:92px}
button,input{font-family:inherit}
button{cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.96)}
input:focus-visible,button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.num{font-variant-numeric:tabular-nums}
.disp{font-weight:700;letter-spacing:-.02em}
header{padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--indigo)}
.month-pill{font-size:12px;font-weight:500;color:var(--faint);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
main{padding:10px 16px 0;max-width:560px;margin:0 auto;animation:fadeIn .25s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 12px}
.sec>span:first-child{font-size:13px;font-weight:600;color:var(--dim)}
.grad-card{background:var(--grad);border-radius:20px;padding:22px 20px;box-shadow:0 12px 36px rgba(79,70,229,.35);position:relative;overflow:hidden}
.grad-card .blob1{position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.grad-card .blob2{position:absolute;bottom:-80px;left:-30px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05)}
.grad-label{font-size:12px;font-weight:600;color:rgba(255,255,255,.75);letter-spacing:.06em;text-transform:uppercase}
.bal{font-size:36px;margin-top:6px}
.pills{display:flex;gap:10px;margin-top:18px}
.pill{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.pill .lbl{font-size:11px;font-weight:600;color:rgba(255,255,255,.75)}
.pill .val{font-size:15px;font-weight:700;margin-top:3px}
.bar{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.bar>div{height:100%;border-radius:3px;width:0;transition:width .8s cubic-bezier(.22,1,.36,1)}
.ring-wrap{position:relative;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg);display:block}
.ring-wrap circle.fg{transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)}
.ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.chip{border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line-soft)}
.row.first{border-top:none}
.row .mid{min-width:0;flex:1}
.row .t1{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;color:var(--faint);margin-top:2px}
.row .amt{font-size:14.5px;font-weight:600;text-align:right}
.row .bal2{font-size:11px;color:var(--faint);margin-top:2px;text-align:right}
.fab{position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:28px;background:var(--grad);color:#fff;border:none;font-size:28px;line-height:1;font-weight:300;box-shadow:0 8px 24px rgba(99,102,241,.4);z-index:20}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,16,26,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:30}
nav button{flex:1;padding:12px 0 16px;background:none;border:none;color:var(--faint)}
nav button.on{color:var(--indigo)}
nav .ic{font-size:16px;line-height:1}
nav .nl{font-size:10.5px;font-weight:600;margin-top:5px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.fpill{display:flex;align-items:center;gap:6px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap}
.fpill .dot{width:7px;height:7px;border-radius:50%}
.cat-name{font-weight:600}
.del-btn{margin:0 0 12px 50px;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.31);color:var(--red);border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:600}
.empty{text-align:center;padding:32px 16px}
.empty .e1{font-size:17px;font-weight:600;color:var(--dim)}
.empty .e2{font-size:13px;color:var(--faint);margin-top:6px}
.overlay{position:fixed;inset:0;background:rgba(4,5,12,.75);z-index:40;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;padding:18px 20px 32px;animation:sheetUp .22s ease}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sheet-head .ti{font-size:18px;font-weight:600}
.x{background:var(--raised);border:none;color:var(--dim);width:30px;height:30px;border-radius:15px;font-size:16px;line-height:1}
.inp{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:15px;padding:13px;margin-bottom:12px}
.inp.big{font-size:19px;font-weight:600}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:12px 0;border-radius:10px;font-size:13.5px;font-weight:600;background:none;border:1px solid var(--line);color:var(--dim);transition:all .15s}
.catpick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.primary{width:100%;background:var(--grad);border:none;color:#fff;border-radius:12px;padding:15px 0;font-size:14.5px;font-weight:700;box-shadow:0 6px 20px rgba(99,102,241,.3)}
.primary:disabled{background:var(--raised);color:var(--faint);box-shadow:none}
.ghost{background:none;border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:14px 0;font-size:13.5px;font-weight:600}
.goal-card{margin-bottom:12px}
.goal-head{display:flex;justify-content:space-between;align-items:baseline}
.goal-name{font-size:17px;font-weight:600}
.goal-actions{display:flex;gap:8px;margin-top:14px}
.goal-add{flex:1;background:rgba(129,140,248,.1);border:1px solid rgba(129,140,248,.31);color:var(--indigo);border-radius:10px;padding:10px 0;font-size:13px;font-weight:600}
.goal-more{background:none;border:1px solid var(--line);color:var(--faint);border-radius:10px;padding:10px 16px;font-size:13px}
.goal-del{margin-top:10px;width:100%;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.31);color:var(--red);border-radius:10px;padding:9px 0;font-size:13px;font-weight:600}
.stack-band{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.legend-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13.5px}
.legend-row .sq{width:9px;height:9px;border-radius:3px;flex-shrink:0}
#err{position:fixed;top:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:10px 14px;font-size:12px;z-index:99;display:none;word-break:break-all}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="err"></div>
<div id="app"></div>
<script>
"use strict";
/* on-screen error reporter — no more silent blank screens */
window.onerror = function (msg, src, line) {
  var e = document.getElementById("err");
  e.style.display = "block";
  e.textContent = "Error: " + msg + " (line " + line + ")";
};

/* ---------- config ---------- */
var KEY = "ledger-data-v1";
var CATS_OUT = ["Food","Transport","Data & Airtime","Rent & Utilities","Business","Health & Gym","Personal","Other"];
var CATS_IN = ["Wages","Freelance","Business","Other"];
var COLORS = {
  "Food":"#fbbf24","Transport":"#38bdf8","Data & Airtime":"#a78bfa","Rent & Utilities":"#f472b6",
  "Business":"#818cf8","Health & Gym":"#34d399","Personal":"#fb923c",
  "Wages":"#4ade80","Freelance":"#22d3ee","Other":"#94a3b8"
};
function cc(cat){ return COLORS[cat] || "#94a3b8"; }

/* ---------- state ---------- */
var S = { tx: [], budgets: {}, goals: [] };
var view = "dash";
var filter = null;
var confirmId = null;
var goalConfirm = null;
var sheet = null;              /* null | "tx" | "goal" | {contrib:goalId} */
var draft = null;              /* preserved tx-sheet values across re-render */
var lastBal = 0;               /* previous balance for the count-up */

try {
  var raw = localStorage.getItem(KEY);
  if (raw) S = JSON.parse(raw);
  if (!S.tx) S.tx = [];
  if (!S.budgets) S.budgets = {};
  if (!S.goals) S.goals = [];
} catch (e) { /* start fresh */ }

var saveTimer = null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }, 300);
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmt(n){
  var v = Number(n) || 0;
  var neg = v < 0; v = Math.abs(v);
  var s = v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "\u2212" : "") + "GH\u20B5 " + s;
}
function fmtShort(n){
  var v = Number(n) || 0;
  if (Math.abs(v) >= 1000) return "GH\u20B5 " + (v/1000).toFixed(1).replace(/\.0$/,"") + "k";
  return "GH\u20B5 " + Math.round(v);
}
function bare(n){ return fmt(n).replace("GH\u20B5 ",""); }
function todayISO(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function mKey(iso){ return iso.slice(0,7); }
function niceDate(iso){
  var p = iso.split("-");
  return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
function mName(key){
  var p = key.split("-");
  return new Date(+p[0], +p[1]-1, 1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function reduced(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

/* ---------- computed ---------- */
function totals(){
  var inc=0, out=0;
  for (var i=0;i<S.tx.length;i++){ if(S.tx[i].type==="in") inc+=S.tx[i].amount; else out+=S.tx[i].amount; }
  return { balance: inc-out };
}
function monthTotals(mk){
  var inc=0, out=0;
  for (var i=0;i<S.tx.length;i++){
    var t=S.tx[i]; if (mKey(t.date)!==mk) continue;
    if (t.type==="in") inc+=t.amount; else out+=t.amount;
  }
  return { inc: inc, out: out };
}
function spentByCat(mk){
  var m={};
  for (var i=0;i<S.tx.length;i++){
    var t=S.tx[i];
    if (t.type==="out" && mKey(t.date)===mk) m[t.cat]=(m[t.cat]||0)+t.amount;
  }
  return m;
}
function budgetTotal(){
  var s=0; for (var k in S.budgets) s+=Number(S.budgets[k]||0); return s;
}

/* ---------- svg ring ---------- */
function ring(pct, size, stroke, color, inner){
  var r=(size-stroke)/2, c=2*Math.PI*r;
  var clamped=Math.min(100,Math.max(0,pct));
  return '<div class="ring-wrap" style="width:'+size+'px;height:'+size+'px">'
    + '<svg width="'+size+'" height="'+size+'">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#1c2030" stroke-width="'+stroke+'"/>'
    + '<circle class="fg" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" data-target="'+(c*(1-clamped/100))+'"/>'
    + '</svg><div class="ring-center">'+inner+'</div></div>';
}

/* ---------- row / chip ---------- */
function chip(cat, size){
  var c=cc(cat);
  return '<div class="chip" style="width:'+size+'px;height:'+size+'px;background:'+c+'1f;border:1px solid '+c+'40;color:'+c+';font-size:'+Math.round(size*0.4)+'px">'+esc(cat.charAt(0))+'</div>';
}
function txRow(t, first, showBal, clickable){
  var amtColor = t.type==="in" ? "var(--green)" : "var(--text)";
  var sign = t.type==="in" ? "+" : "\u2212";
  return '<div class="row'+(first?' first':'')+'"'+(clickable?' data-act="confirm" data-id="'+t.id+'" style="cursor:pointer"':'')+'>'
    + chip(t.cat, 38)
    + '<div class="mid"><div class="t1">'+esc(t.note||t.cat)+'</div>'
    + '<div class="t2"><span class="cat-name" style="color:'+cc(t.cat)+'">'+esc(t.cat)+'</span> \u00B7 '+niceDate(t.date)+'</div></div>'
    + '<div><div class="amt num" style="color:'+amtColor+'">'+sign+bare(t.amount)+'</div>'
    + (showBal && t.bal!==undefined ? '<div class="bal2 num">bal '+fmtShort(t.bal)+'</div>' : '')
    + '</div></div>';
}

/* ---------- views ---------- */
function dashView(){
  var nm = mKey(todayISO());
  var mt = monthTotals(nm);
  var bal = totals().balance;
  var bt = budgetTotal();
  var byCat = spentByCat(nm);
  var cats = Object.keys(byCat).map(function(k){return [k,byCat[k]];}).sort(function(a,b){return b[1]-a[1];});
  var catTotal = cats.reduce(function(s,x){return s+x[1];},0);
  var recent = S.tx.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts; }).slice(0,5);
  var goalSaved = S.goals.reduce(function(s,g){return s+g.saved;},0);
  var h = '';

  h += '<div class="grad-card"><div class="blob1"></div><div class="blob2"></div>'
    + '<div class="grad-label">Total balance</div>'
    + '<div class="bal disp num" id="balNum" data-from="'+lastBal+'" data-to="'+bal+'">'+fmt(lastBal)+'</div>'
    + '<div class="pills">'
    + '<div class="pill"><div class="lbl">\u2193 In this month</div><div class="val num" style="color:var(--green)">'+fmtShort(mt.inc)+'</div></div>'
    + '<div class="pill"><div class="lbl">\u2191 Out this month</div><div class="val num" style="color:#fda4af">'+fmtShort(mt.out)+'</div></div>'
    + '</div></div>';

  if (bt > 0){
    var pct = (mt.out/bt)*100, over = mt.out>bt;
    h += '<div class="sec"><span>Monthly budget</span></div><div class="card" style="display:flex;align-items:center;gap:16px">'
      + ring(pct, 64, 6, over?"var(--red)":"var(--indigo)", '<span class="num" style="font-size:13px;font-weight:700;color:'+(over?'var(--red)':'var(--indigo)')+'">'+Math.min(999,Math.round(pct))+'%</span>')
      + '<div style="flex:1"><div class="num" style="font-size:15px;font-weight:600;color:'+(over?'var(--red)':'var(--text)')+'">'+fmt(mt.out)+'</div>'
      + '<div class="num" style="font-size:12.5px;color:var(--faint);margin-top:3px">of '+fmt(bt)+' budget</div>'
      + '<div style="font-size:12px;margin-top:5px;font-weight:600;color:'+(over?'var(--red)':'var(--green)')+'">'+(over?fmt(mt.out-bt)+' over':fmt(bt-mt.out)+' remaining')+'</div></div></div>';
  }

  if (cats.length){
    h += '<div class="sec"><span>Spending by category</span></div><div class="card">'
      + '<div class="stack-band">';
    cats.forEach(function(x){ h += '<div style="width:'+(x[1]/catTotal*100)+'%;background:'+cc(x[0])+';min-width:3px"></div>'; });
    h += '</div><div style="margin-top:14px">';
    cats.slice(0,5).forEach(function(x){
      h += '<div class="legend-row"><span class="sq" style="background:'+cc(x[0])+'"></span>'
        + '<span style="color:var(--dim);flex:1">'+esc(x[0])+'</span>'
        + '<span class="num" style="font-weight:600;font-size:13px">'+fmtShort(x[1])+'</span>'
        + '<span class="num" style="font-size:11.5px;color:var(--faint);width:34px;text-align:right">'+Math.round(x[1]/catTotal*100)+'%</span></div>';
    });
    h += '</div></div>';
  }

  if (S.goals.length){
    h += '<div class="sec"><span>Goals</span></div><div class="card" style="display:flex;justify-content:space-between;align-items:center">'
      + '<span style="font-size:13.5px;color:var(--dim)">'+S.goals.length+' goal'+(S.goals.length>1?'s':'')+' in progress</span>'
      + '<span class="num" style="font-size:14px;font-weight:600;color:var(--green)">'+fmtShort(goalSaved)+' saved</span></div>';
  }

  h += '<div class="sec"><span>Recent activity</span></div>';
  if (!recent.length){
    h += '<div class="card empty"><div class="e1">No activity yet</div><div class="e2">Tap + to record your first transaction.</div></div>';
  } else {
    h += '<div class="card" style="padding:3px 16px">';
    recent.forEach(function(t,i){ h += txRow(t, i===0, false, false); });
    h += '</div>';
  }
  lastBal = bal;
  return h;
}

function txView(){
  var sorted = S.tx.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts; });
  if (!sorted.length){
    return '<div class="card empty"><div class="e1">No transactions yet</div><div class="e2">Everything you record shows up here, organized by category color.</div></div>';
  }
  var run=0;
  var withBal = sorted.map(function(t){
    run += t.type==="in" ? t.amount : -t.amount;
    var o = {}; for (var k in t) o[k]=t[k]; o.bal=run; return o;
  });
  var activeCats = [];
  withBal.forEach(function(t){ if (activeCats.indexOf(t.cat)<0) activeCats.push(t.cat); });
  var visible = filter ? withBal.filter(function(t){return t.cat===filter;}) : withBal;

  var h = '<div class="filters">';
  h += fpill(!filter, "var(--indigo)", "All", "");
  activeCats.forEach(function(c){ h += fpill(filter===c, cc(c), c, c); });
  h += '</div>';

  var months = {};
  visible.forEach(function(t){ var k=mKey(t.date); (months[k]=months[k]||[]).push(t); });
  Object.keys(months).sort().reverse().forEach(function(mk){
    var rows = months[mk].slice().reverse();
    var mi=0, mo=0;
    months[mk].forEach(function(t){ if(t.type==="in") mi+=t.amount; else mo+=t.amount; });
    h += '<div class="sec"><span>'+mName(mk)+'</span><span class="num" style="font-size:12px">'
      + '<span style="color:var(--green)">+'+fmtShort(mi).replace("GH\u20B5 ","")+'</span>'
      + '<span style="color:var(--faint)"> / </span>'
      + '<span style="color:var(--red)">\u2212'+fmtShort(mo).replace("GH\u20B5 ","")+'</span></span></div>';
    h += '<div class="card" style="padding:3px 16px">';
    rows.forEach(function(t,i){
      h += txRow(t, i===0, !filter, true);
      if (confirmId===t.id){
        h += '<button class="del-btn" data-act="deltx" data-id="'+t.id+'">Delete transaction</button>';
      }
    });
    h += '</div>';
  });
  return h;
}
function fpill(active, color, label, val){
  return '<button class="fpill" data-act="filter" data-val="'+esc(val)+'" style="'
    + (active ? 'background:'+color+'1f;border-color:'+color+'60;color:'+color : '')
    + '"><span class="dot" style="background:'+color+'"></span>'+esc(label)+'</button>';
}

function budgetView(){
  var nm = mKey(todayISO());
  var spent = spentByCat(nm);
  var totalSpent = 0; for (var k in spent) totalSpent += spent[k];
  var bt = budgetTotal();
  var over = bt>0 && totalSpent>bt;
  var pct = bt>0 ? totalSpent/bt*100 : 0;

  var h = '<div class="card" style="background:linear-gradient(135deg,var(--surface) 0%,#171a2e 100%);display:flex;align-items:center;gap:18px">'
    + ring(pct, 92, 8, over?"var(--red)":"var(--indigo)",
        '<div><div class="num" style="font-size:17px;font-weight:700;color:'+(over?'var(--red)':'var(--text)')+'">'+(bt>0?Math.min(999,Math.round(pct))+'%':'\u2014')+'</div><div style="font-size:9.5px;color:var(--faint);font-weight:600;letter-spacing:.04em">USED</div></div>')
    + '<div style="flex:1"><div style="font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.05em;text-transform:uppercase">Spent this month</div>'
    + '<div class="disp num" style="font-size:22px;margin-top:4px;color:'+(over?'var(--red)':'var(--text)')+'">'+fmt(totalSpent)+'</div>'
    + '<div class="num" style="font-size:12.5px;color:var(--faint);margin-top:3px">'+(bt>0?'of '+fmt(bt)+' budget':'no budget set')+'</div></div></div>';

  h += '<div class="sec"><span>Category limits</span></div>';
  CATS_OUT.forEach(function(cat){
    var b = Number(S.budgets[cat]||0), s = spent[cat]||0;
    var catOver = b>0 && s>b;
    var c = cc(cat);
    var rp = b>0 ? s/b*100 : 0;
    h += '<div class="card" style="margin-bottom:10px;padding:13px 16px"><div style="display:flex;align-items:center;gap:13px">'
      + ring(rp, 46, 4.5, catOver?"var(--red)":c,
          '<span class="num" style="font-size:10.5px;font-weight:700;color:'+(catOver?'var(--red)':c)+'">'+(b>0?Math.min(99,Math.round(rp))+(s>b?'+':'')+'%':'\u00B7')+'</span>')
      + '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">'+esc(cat)+'</div>'
      + (b>0 ? '<div class="num" style="font-size:11.5px;margin-top:3px;color:'+(catOver?'var(--red)':'var(--faint)')+'">'+bare(s)+' \u00B7 '+(catOver?'over by '+bare(s-b):bare(b-s)+' left')+'</div>' : '')
      + '</div><div style="display:flex;align-items:center;gap:6px">'
      + '<span style="font-size:11.5px;color:var(--faint)">GH\u20B5</span>'
      + '<input type="number" inputmode="numeric" placeholder="0" class="num budget-in" data-cat="'+esc(cat)+'" value="'+(S.budgets[cat]!=null?esc(S.budgets[cat]):'')+'" style="width:78px;background:var(--raised);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:13.5px;font-weight:500;padding:8px 9px;text-align:right">'
      + '</div></div></div>';
  });
  return h;
}

function goalsView(){
  var h = '';
  if (!S.goals.length){
    h += '<div class="card empty"><div class="e1">No goals yet</div><div class="e2">Set a target and put money against it.</div></div>';
  } else {
    S.goals.forEach(function(g){
      var pct = g.target>0 ? g.saved/g.target*100 : 0;
      var done = g.saved >= g.target;
      h += '<div class="card goal-card"><div class="goal-head"><span class="goal-name">'+esc(g.name)+'</span>'
        + '<span class="num" style="font-size:12.5px;font-weight:600;color:'+(done?'var(--green)':'var(--indigo)')+'">'+(done?'Reached \u2713':Math.floor(pct)+'%')+'</span></div>'
        + '<div style="margin-top:13px"><div class="bar"><div data-target="'+Math.min(100,pct)+'" style="background:'+(done?'var(--green)':'var(--indigo)')+'"></div></div></div>'
        + '<div class="num" style="display:flex;justify-content:space-between;font-size:12.5px;margin-top:8px">'
        + '<span style="color:var(--green);font-weight:600">'+fmt(g.saved)+'</span>'
        + '<span style="color:var(--faint)">of '+fmt(g.target)+'</span></div>'
        + '<div class="goal-actions">'
        + '<button class="goal-add" data-act="contrib" data-id="'+g.id+'">Add money</button>'
        + '<button class="goal-more" data-act="goalmore" data-id="'+g.id+'">\u00B7\u00B7\u00B7</button></div>'
        + (goalConfirm===g.id ? '<button class="goal-del" data-act="delgoal" data-id="'+g.id+'">Delete goal</button>' : '')
        + '</div>';
    });
  }
  h += '<button class="primary" style="margin-top:8px" data-act="newgoal">New goal</button>';
  return h;
}

/* ---------- sheets ---------- */
function sheetHtml(){
  if (!sheet) return '';
  var inner = '';
  if (sheet === "tx") inner = txSheet();
  else if (sheet === "goal") inner = goalSheet();
  else if (sheet.contrib) inner = contribSheet(sheet.contrib);
  if (!inner) return '';
  return '<div class="overlay" data-act="closeover">'
    + '<div class="sheet" data-stop="1"><div class="handle"></div>' + inner + '</div></div>';
}
function txSheet(){
  var d = draft || { type:"out", amount:"", cat:CATS_OUT[0], note:"", date:todayISO() };
  var cats = d.type==="in" ? CATS_IN : CATS_OUT;
  if (cats.indexOf(d.cat)<0) d.cat = cats[0];
  var h = '<div class="sheet-head"><span class="ti">New transaction</span><button class="x" data-act="closesheet">\u00D7</button></div>';
  h += '<div class="seg">'
    + '<button data-act="txtype" data-val="out" style="'+(d.type==="out"?'background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.38);color:var(--red)':'')+'">Money out</button>'
    + '<button data-act="txtype" data-val="in" style="'+(d.type==="in"?'background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.38);color:var(--green)':'')+'">Money in</button></div>';
  h += '<input id="f-amount" class="inp big num" type="number" inputmode="decimal" placeholder="Amount (GH\u20B5)" value="'+esc(d.amount)+'">';
  h += '<div class="catpick">';
  cats.forEach(function(c){
    var col = cc(c), on = d.cat===c;
    h += '<button class="fpill" data-act="pickcat" data-val="'+esc(c)+'" style="'+(on?'background:'+col+'1f;border-color:'+col+'60;color:'+col:'background:var(--raised)')+'"><span class="dot" style="background:'+col+'"></span>'+esc(c)+'</button>';
  });
  h += '</div>';
  h += '<input id="f-note" class="inp" type="text" placeholder="Note (optional)" value="'+esc(d.note)+'">';
  h += '<input id="f-date" class="inp" type="date" value="'+esc(d.date)+'" style="color-scheme:dark">';
  h += '<button class="primary" data-act="savetx" style="margin-top:4px">Save transaction</button>';
  return h;
}
function goalSheet(){
  return '<div class="sheet-head"><span class="ti">New goal</span><button class="x" data-act="closesheet">\u00D7</button></div>'
    + '<input id="g-name" class="inp" type="text" placeholder="What are you saving for?">'
    + '<input id="g-target" class="inp big num" type="number" inputmode="decimal" placeholder="Target (GH\u20B5)">'
    + '<button class="primary" data-act="savegoal" style="margin-top:4px">Create goal</button>';
}
function contribSheet(id){
  var g = null;
  for (var i=0;i<S.goals.length;i++) if (S.goals[i].id===id) g=S.goals[i];
  if (!g) return '';
  return '<div class="sheet-head"><span class="ti">'+esc(g.name)+'</span><button class="x" data-act="closesheet">\u00D7</button></div>'
    + '<div class="num" style="font-size:12.5px;color:var(--faint);margin-bottom:12px">'+fmt(g.saved)+' of '+fmt(g.target)+' so far</div>'
    + '<input id="c-amount" class="inp big num" type="number" inputmode="decimal" placeholder="Amount (GH\u20B5)">'
    + '<div style="display:flex;gap:8px">'
    + '<button class="primary" style="flex:1;padding:14px 0;font-size:13.5px" data-act="docontrib" data-sign="1" data-id="'+g.id+'">Add money</button>'
    + '<button class="ghost" style="flex:1" data-act="docontrib" data-sign="-1" data-id="'+g.id+'">Withdraw</button></div>';
}

/* ---------- shell ---------- */
function navHtml(){
  var items = [["dash","\u25C6","Home"],["tx","\u2263","Activity"],["budget","\u25D0","Budget"],["goals","\u25CE","Goals"]];
  var h = '<nav>';
  items.forEach(function(it){
    h += '<button data-act="nav" data-val="'+it[0]+'" class="'+(view===it[0]?'on':'')+'"><div class="ic">'+it[1]+'</div><div class="nl">'+it[2]+'</div></button>';
  });
  return h + '</nav>';
}
function render(){
  var nm = mKey(todayISO());
  var h = '<header><h1>ledger<span>.</span></h1><span class="month-pill">'+mName(nm)+'</span></header><main>';
  if (view==="dash") h += dashView();
  else if (view==="tx") h += txView();
  else if (view==="budget") h += budgetView();
  else h += goalsView();
  h += '</main>';
  if (view==="dash" || view==="tx") h += '<button class="fab" data-act="opentx" aria-label="Add transaction">+</button>';
  h += navHtml() + sheetHtml();
  document.getElementById("app").innerHTML = h;
  bindInputs();
  animate();
}

/* ---------- animation ---------- */
function animate(){
  /* rings + bars sweep in */
  requestAnimationFrame(function(){
    var fgs = document.querySelectorAll("circle.fg");
    for (var i=0;i<fgs.length;i++){
      var el = fgs[i];
      if (reduced()) el.style.transition = "none";
      el.setAttribute("stroke-dashoffset", el.getAttribute("data-target"));
    }
    var bars = document.querySelectorAll(".bar>div[data-target]");
    for (var j=0;j<bars.length;j++) bars[j].style.width = bars[j].getAttribute("data-target") + "%";
  });
  /* balance count-up */
  var b = document.getElementById("balNum");
  if (b){
    var from = Number(b.getAttribute("data-from")), to = Number(b.getAttribute("data-to"));
    if (reduced() || from === to){ b.textContent = fmt(to); return; }
    var start = performance.now(), dur = 900;
    (function tick(now){
      var p = Math.min(1,(now-start)/dur);
      var e = 1 - Math.pow(1-p,3);
      b.textContent = fmt(from + (to-from)*e);
      if (p<1) requestAnimationFrame(tick);
    })(start);
  }
}

/* ---------- events ---------- */
function captureDraft(){
  var a = document.getElementById("f-amount");
  if (!a) return;
  draft = draft || { type:"out", amount:"", cat:CATS_OUT[0], note:"", date:todayISO() };
  draft.amount = a.value;
  draft.note = document.getElementById("f-note").value;
  draft.date = document.getElementById("f-date").value || todayISO();
}
document.getElementById("app").addEventListener("click", function(ev){
  var el = ev.target;
  while (el && el !== this && !el.getAttribute("data-act") && !el.getAttribute("data-stop")) el = el.parentNode;
  if (!el || el === this) return;
  if (el.getAttribute("data-stop")) return;           /* clicks inside the sheet don't close it */
  var act = el.getAttribute("data-act");
  var val = el.getAttribute("data-val");
  var id = el.getAttribute("data-id");

  if (act==="nav"){ view=val; confirmId=null; goalConfirm=null; render(); }
  else if (act==="opentx"){ draft=null; sheet="tx"; render(); var f=document.getElementById("f-amount"); if(f) f.focus(); }
  else if (act==="newgoal"){ sheet="goal"; render(); var g=document.getElementById("g-name"); if(g) g.focus(); }
  else if (act==="contrib"){ sheet={contrib:id}; render(); var c=document.getElementById("c-amount"); if(c) c.focus(); }
  else if (act==="closesheet" || act==="closeover"){ sheet=null; draft=null; render(); }
  else if (act==="txtype"){ captureDraft(); draft.type=val; var cats=val==="in"?CATS_IN:CATS_OUT; draft.cat=cats[0]; render(); }
  else if (act==="pickcat"){ captureDraft(); draft.cat=val; render(); }
  else if (act==="filter"){ filter = val || null; if (filter===val && el.style.color && val==="") filter=null; confirmId=null; render(); }
  else if (act==="confirm"){ confirmId = (confirmId===id?null:id); render(); }
  else if (act==="deltx"){
    S.tx = S.tx.filter(function(t){return t.id!==id;});
    confirmId=null; persist(); render();
  }
  else if (act==="goalmore"){ goalConfirm = (goalConfirm===id?null:id); render(); }
  else if (act==="delgoal"){
    S.goals = S.goals.filter(function(g){return g.id!==id;});
    goalConfirm=null; persist(); render();
  }
  else if (act==="savetx"){
    captureDraft();
    var amt = parseFloat(draft.amount);
    if (!amt || amt<=0) return;
    S.tx.push({ id:uid(), type:draft.type, amount:amt, cat:draft.cat, note:(draft.note||"").trim(), date:draft.date, ts:Date.now() });
    sheet=null; draft=null; persist(); render();
  }
  else if (act==="savegoal"){
    var name = document.getElementById("g-name").value.trim();
    var tgt = parseFloat(document.getElementById("g-target").value);
    if (!name || !tgt || tgt<=0) return;
    S.goals.push({ id:uid(), name:name, target:tgt, saved:0 });
    sheet=null; persist(); render();
  }
  else if (act==="docontrib"){
    var ca = parseFloat(document.getElementById("c-amount").value);
    if (!ca || ca<=0) return;
    var sign = Number(el.getAttribute("data-sign"));
    for (var i=0;i<S.goals.length;i++){
      if (S.goals[i].id===id) S.goals[i].saved = Math.max(0, S.goals[i].saved + sign*ca);
    }
    sheet=null; persist(); render();
  }
});
function bindInputs(){
  var ins = document.querySelectorAll(".budget-in");
  for (var i=0;i<ins.length;i++){
    ins[i].addEventListener("change", function(){
      S.budgets[this.getAttribute("data-cat")] = this.value;
      persist(); render();
    });
  }
}

render();

/* offline support */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
